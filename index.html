<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wąż bez Granic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="fireflies" class="fireflies" aria-hidden="true"></canvas>
  <main class="game">
    <h1><img class="logo" src="assets/logo.svg" alt="Wąż bez Granic" width="400" height="69"></h1>
    <div class="layout">
      <div class="board-column">
        <div class="score-bar">
          <span>Wynik: <strong id="score">0</strong></span>
          <span>Rekord: <strong id="high-score">0</strong></span>
        </div>
        <canvas id="board" width="400" height="400"></canvas>
        <form id="nickname-form" class="nickname-form" hidden>
          <label for="nickname">Jesteś w top 10! Twój nick:</label>
          <input id="nickname" name="nickname" maxlength="16" autocomplete="off">
          <button type="submit">Zapisz</button>
        </form>
      </div>
      <aside class="sidebar">
        <section id="account" class="panel account">
          <h2>Konto</h2>
          <form id="account-form" class="account-form" hidden>
            <p class="account-hint">Grasz jako gość.</p>
            <input id="account-username" name="username" placeholder="login" maxlength="16"
                   autocomplete="username" autocapitalize="none" spellcheck="false">
            <input id="account-password" name="password" type="password" placeholder="hasło"
                   autocomplete="current-password">
            <div class="account-buttons">
              <button type="submit">Zaloguj</button>
              <button type="button" id="account-register" class="secondary">Załóż konto</button>
            </div>
          </form>
          <div id="account-profile" class="account-profile" hidden>
            <p>Zalogowany: <strong id="account-name"></strong></p>
            <p>Najlepszy wynik: <strong id="account-best">0</strong></p>
            <p>Rozegrane gry: <strong id="account-games">0</strong></p>
            <button type="button" id="account-logout" class="secondary">Wyloguj</button>
          </div>
          <p id="account-message" class="account-message"></p>
        </section>
        <section class="panel leaderboard">
          <h2>Najlepsi</h2>
          <ol id="top-scores"></ol>
          <p id="cloud-status" class="cloud-status"></p>
        </section>
      </aside>
    </div>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
